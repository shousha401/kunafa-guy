<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PREVIEW GUARD — keeps the provisional site (placeholder prices, unverified
         claims) out of Google while the owner reviews it. DELETE this one line at
         real launch, once prices/claims are confirmed, so the site can be indexed. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>The Kunafah Guy — Fresh Kunafah &amp; Smash Burgers · Fresno, CA</title>
    <meta
      name="description"
      content="Fresh molten kunafah and crispy smash burgers, one griddle, Fresno CA. 2 Smash Burgers $10. Call or text (209) 712-6676. Catering all of California."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical + Open Graph. The relative "/" and "/og-image.jpg" resolve against
         whatever origin serves the page, so they are correct on any Vercel URL out of
         the box. At real launch on the final domain, swap these to absolute URLs
         (e.g. https://thekunafahguy.com/) for maximum link-preview compatibility. -->
    <link rel="canonical" href="/" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="The Kunafah Guy" />
    <meta property="og:title" content="The Kunafah Guy — Kunafah & Smash Burgers, Fresno" />
    <meta
      property="og:description"
      content="2 Smash Burgers — $10. Fresh kunafah made to order. Call/text (209) 712-6676."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1B1815" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600&family=Aref+Ruqaa:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
